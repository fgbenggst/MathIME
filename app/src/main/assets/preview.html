<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"><style>html,body{margin:0;padding:0;background:transparent;color:#17202b;font-family:sans-serif}#formula{padding:8px 10px;min-height:42px;overflow-x:auto;white-space:nowrap;font-size:120%;text-align:center}#error{color:#ae2835;font-size:12px;padding:0 8px;display:none}svg{max-width:none!important} mjx-assistive-mml{position:absolute!important;width:1px!important;height:1px!important;overflow:hidden!important;clip:rect(1px,1px,1px,1px)!important;opacity:0!important} mjx-container{display:block!important;text-align:center!important} .MathJax{outline:0}</style><script>window.MathJax={startup:{typeset:false},svg:{fontCache:'local'},options:{enableMenu:false}};</script><script src="mathjax-tex-svg.js"></script></head><body><div id="formula" role="img" aria-label="數學公式預覽">等待辨識…</div><div id="error"></div><script>
let requested='';let ready=false;let renderState='loading';window.previewStatus=()=>renderState;
function render(tex){requested=tex;if(!ready)return;const node=document.getElementById('formula'),error=document.getElementById('error');error.style.display='none';if(!tex.trim()){node.textContent='等待辨識…';return;}try{node.textContent='';MathJax.tex2svgPromise(tex,{display:true}).then(svg=>{if(requested!==tex)return;node.replaceChildren(svg);renderState='ok';const err=svg.querySelector('[data-mjx-error]');if(err){error.textContent='公式可能有語法錯誤，請檢查 LaTeX';error.style.display='block';}}).catch(e=>{if(requested!==tex)return;node.textContent='無法預覽';renderState='error';error.textContent=String(e.message||e);error.style.display='block';});}catch(e){node.textContent='無法預覽';renderState='error';error.textContent=String(e.message||e);error.style.display='block';}}
MathJax.startup.promise.then(()=>{ready=true;renderState='ready';render(requested);}).catch(e=>{renderState='error';document.getElementById('formula').textContent='預覽引擎載入失敗';document.getElementById('error').textContent=String(e);document.getElementById('error').style.display='block';});
</script></body></html>
